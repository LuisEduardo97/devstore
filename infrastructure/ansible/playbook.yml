---
- name: Automatizar validacao do ambiente DevStore
  hosts: devstore
  gather_facts: false

  tasks:
    - name: Verificar se o container DevStore esta em execucao
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - name=devstore-iac
          - --filter
          - status=running
          - --quiet
      register: container_status
      changed_when: false

    - name: Iniciar o container DevStore caso esteja parado
      ansible.builtin.command:
        argv:
          - docker
          - start
          - devstore-iac
      when: container_status.stdout == ""
      register: container_start
      changed_when: true

    - name: Validar disponibilidade da API DevStore
      ansible.builtin.uri:
        url: http://localhost:3001
        method: GET
        status_code: 200
        return_content: true
      register: api_result
      retries: 5
      delay: 2
      until: api_result.status == 200

    - name: Exibir resultado da validacao
      ansible.builtin.debug:
        msg: "API DevStore validada com sucesso: {{ api_result.content }}"